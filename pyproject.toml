[project]
name = "rag-rks"
version = "0.1.0"
description = "RAG System with Reflex and Qdrant"
authors = [
    {name = "Markov, Artem",email = "amarkov@rtatex.ru"}
]
readme = "README.md"
requires-python = "^3.10"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "reflex",
    "qdrant-client",
    "google-generativeai",
    "langchain-google-genai",
    "langchain-community",
    "pypdf",
    "pydantic-settings",
    "fastembed (>=0.8.0,<0.9.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)"
]
